    .article-body blockquote p{text-indent:0;margin-bottom:0}

    .sidebar-card{background:var(--card-bg);border-radius:8px;padding:18px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.04)}
