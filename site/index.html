          <p>今年以来，沪铝主力合约从年初的18,500元/吨震荡上行至当前20,200元/吨附近，涨幅约9%。驱动因素主要有三个：</p>

          <h3>五、🚀 马斯克说</h3>

          <div class="highlight-box">
            <div class="label">⚡ 马斯克视角</div>
            <p>以下以马斯克第一视角分析，基于公开言论推断，非本人观点。</p>
          </div>

        <p><strong>关于 Alphabet 的 $800 亿融资：</strong></p>
        <p>第一性原理问：AI 训练和推理的真正瓶颈是什么？是算力，是能源，还是数据中心的物理空间？</p>
        <p>Alphabet 选择股权融资而非债务，说明管理层认为 AI 投资回报周期长、风险高，不愿承受利息压力。这本身就是一个信号——连 Google 都没信心靠自有现金流覆盖 AI 基建。对比之下，特斯拉的 Dojo 超算策略更有效率：垂直整合芯片、算法、能源三位一体，而不是纯烧钱买算力。</p>
        <p>$1,000 的 Micron 呢？存储芯片是 AI 推理的「隐形瓶颈」。如果每块 GPU 都需要配套 HBM 内存，Micron 就是 AI 时代的「卖铲人」——但不是所有的铲子都能持续高价。一旦内存产能过剩，白痴指数就会暴露。</p>

        <p><strong>关于霍尔木兹海峡：</strong></p>
        <p>油轮卡在海峡，成本结构被彻底打乱。绕行好望角的运输成本和时间翻倍，这是地缘政治的「白痴指数」——花这么多资源去维护一条航线的安全，为什么不多搞点本土能源储备和替代能源？</p>
        <p>每次危机都证明：依赖越深，脆弱性越大。</p>

          <p class="footnote">数据来源：CNBC、MarketWatch、财联社、华尔街见闻 · 以上内容仅供参考，不构成投资建议</p>
        `
      }
    ];

    const fmtDate = d => {
      const w = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      return d.getFullYear()+' 年 '+String(d.getMonth()+1).padStart(2,'0')+' 月 '+String(d.getDate()).padStart(2,'0')+' 日 · '+w[d.getDay()];
    };
    const now = new Date();
    document.getElementById('todayDate').textContent = fmtDate(now);
    document.getElementById('footerYear').textContent = now.getFullYear();

    const list = document.getElementById('articleList');
    articles.forEach(a => {
      const card = document.createElement('div');
      card.className = 'article-card';
      card.innerHTML = `
        <div class="article-header">
          <div class="article-category">${a.cat}</div>
          <div class="article-title">${a.title}</div>
          <div class="article-meta">${a.date} · ${a.edition}</div>
          <div class="article-excerpt">${a.excerpt}</div>
          <div class="article-expand">▾</div>
        </div>
        <div class="article-body">${a.body}</div>
      `;
      card.addEventListener('click', () => {
        const wasActive = card.classList.contains('active');
        document.querySelectorAll('.article-card').forEach(c => c.classList.remove('active'));
        if (!wasActive) card.classList.add('active');
      });
      list.appendChild(card);
    });
    
    // Auto-open latest
    if (articles.length) list.firstChild.classList.add('active');
  </script>
</body>
</html>
